{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}Admin Console | {{ title }}{% endblock %}

{% block extrahead %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'admin/custom.css' %}">
{% endblock %}

{% block branding %}
  <h1 id="site-name">Admin Console</h1>
{% endblock %}

{% block extrajs %}
  <script>
    (function() {
      function initMobileNav() {
        if (window.innerWidth >= 769) return;
        
        var existingToggle = document.querySelector('.mobile-nav-toggle');
        var existingNav = document.querySelector('.mobile-nav-wrapper');
        if (existingToggle) existingToggle.remove();
        if (existingNav) existingNav.remove();
        
        var header = document.getElementById('header');
        if (!header) return;
        
        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'mobile-nav-toggle';
        toggleBtn.innerHTML = '&#9776;';
        toggleBtn.type = 'button';
        
        var navWrapper = document.createElement('div');
        navWrapper.className = 'mobile-nav-wrapper';
        
        // All admin apps and models
        var items = [
          { section: 'Quick Actions', items: [
            { name: 'Dashboard', url: '/admin/' },
          ]},
          { section: 'Accounts & Users', items: [
            { name: 'Users', url: '/admin/accounts/user/' },
          ]},
          { section: 'Registrations', items: [
            { name: 'Hajj Registrations', url: '/admin/registrations/hajjregistration/' },
            { name: 'Registration Steps', url: '/admin/registrations_registrationstep/' },
            { name: 'Travel Documents', url: '/admin/registrations/traveldocument/' },
            { name: 'Support Tickets', url: '/admin/registrations/supportticket/' },
            { name: 'Dashboard Stats', url: '/admin/registrations_userdashboardstats/' },
          ]},
          { section: 'Packages', items: [
            { name: 'All Packages', url: '/admin/packages/package/' },
            { name: 'Package Types', url: '/admin/packages_packagetype/' },
          ]},
          { section: 'Payments', items: [
            { name: 'Payments', url: '/admin/payments_payment/payment/' },
            { name: 'Payment Methods', url: '/admin/payments_paymentmethod/' },
          ]},
          { section: 'Documents', items: [
            { name: 'Documents', url: '/admin/documents_document/' },
          ]},
          { section: 'Blog', items: [
            { name: 'Blog Posts', url: '/admin/blog/blogpost/' },
            { name: 'Categories', url: '/admin/blog_blogcategory/' },
            { name: 'Comments', url: '/admin/blog_blogcomment/' },
            { name: 'Viewers', url: '/admin/blog_blogviewer/' },
          ]},
          { section: 'FAQs & Support', items: [
            { name: 'FAQs', url: '/admin/faqs_faq/' },
            { name: 'FAQ Categories', url: '/admin/faqs_faqcategory/' },
          ]},
          { section: 'Sacred Sites', items: [
            { name: 'Sacred Sites', url: '/admin/sacredsites_sacredsite/' },
          ]},
          { section: 'Home Content', items: [
            { name: 'Hero Slides', url: '/admin/homecontent_heroslide/' },
            { name: 'Experience Sections', url: '/admin/homecontent_experience/' },
            { name: 'Service Sections', url: '/admin/homecontent_service/' },
            { name: 'CTA Sections', url: '/admin/homecontent_ctasection/' },
          ]},
          { section: 'Engagement', items: [
            { name: 'Testimonials', url: '/admin/testimonials_testimonial/' },
            { name: 'Newsletter Subscribers', url: '/admin/newsletter_newsletterrequest/' },
            { name: 'Send Newsletter', url: '/admin/newsletter_newsletter/' },
          ]},
        ];
        
        items.forEach(function(group) {
          var section = document.createElement('div');
          section.className = 'mobile-nav-section';
          section.textContent = group.section;
          navWrapper.appendChild(section);
          
          group.items.forEach(function(item) {
            var link = document.createElement('a');
            link.className = 'mobile-nav-item';
            link.href = item.url;
            link.textContent = item.name;
            navWrapper.appendChild(link);
          });
        });
        
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          navWrapper.classList.toggle('show');
        });
        
        document.addEventListener('click', function(e) {
          if (!toggleBtn.contains(e.target) && !navWrapper.contains(e.target)) {
            navWrapper.classList.remove('show');
          }
        });
        
        header.style.position = 'relative';
        header.appendChild(toggleBtn);
        header.appendChild(navWrapper);
      }
      
      initMobileNav();
      window.addEventListener('resize', function() {
        initMobileNav();
      });
    })();
  </script>
{% endblock %}
