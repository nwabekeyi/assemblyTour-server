{% extends "admin/change_form.html" %}
{% load static %}

{% block after_field_sets %}
    {% if original.current_step.code == "registration_form" %}
        <div style="margin-top: 1em; padding: 1em; border: 1px solid #ccc; border-radius: 4px;">
            <h3>Step 2 Actions</h3>
            <div style="margin-bottom: 0.5em;">
                <label>Rejection Reason (if rejecting):</label>
                <input type="text" name="reason" placeholder="Enter reason" style="width: 60%;" />
            </div>
            <button name="_approve_step2" type="submit" class="button default">Approve Step 2</button>
            <button name="_reject_step2" type="submit" class="button default" style="background:#e53e3e;color:white;">Reject Step 2</button>
        </div>
    {% endif %}
{% endblock %}
